name: Contingencia Nativa de Stories

on:
  schedule:
    # Segunda camada independente do workflow principal, em horário de Brasília:
    # 05:10, 05:25 e 05:40. A trava diária impede envios duplicados.
    - cron: "10 8 * * *"
    - cron: "25 8 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch:

concurrency:
  group: stories-diarios
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Gerar e enviar Stories
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          STORIES_PER_RUN: "3"
        run: >-
          python main.py
          --count "3"
          --day "automatico"
          --run-mode "schedule"
          --special "nenhum"

      - name: Persistir historico
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/daily_runs.json
          git diff --cached --quiet || git commit -m "chore: atualizar historico de citacoes"
          git push

name: Gerar Stories de Citacoes

on:
  schedule:
    # Três janelas redundantes entre 05:03 e 05:43 (Brasília). A trava diária
    # encerra as janelas seguintes depois do primeiro envio bem-sucedido.
    - cron: "3 8 * * *"
    - cron: "23 8 * * *"
    - cron: "43 8 * * *"
  push:
    paths:
      - "data/run-now.json"
  workflow_dispatch:
    inputs:
      quantidade:
        description: Quantidade de Stories nesta execucao
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]
      dia:
        description: Dia editorial (automatico usa o dia atual)
        required: true
        default: "automatico"
        type: choice
        options: ["automatico", "segunda", "terca", "quarta", "quinta", "sexta", "sabado", "domingo"]

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -q

      - name: Gerar e enviar Stories de teste
        env:
          TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TEST_TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          STORIES_PER_RUN: ${{ inputs.quantidade || '3' }}
        run: >-
          python main.py
          --count "${{ inputs.quantidade || '3' }}"
          --day "${{ inputs.dia || 'automatico' }}"
          --run-mode "${{ github.event_name }}"
          --special "${{ github.event_name == 'push' && 'poder_corrupcao' || 'nenhum' }}"

      - name: Persistir historico
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/daily_runs.json
          git diff --cached --quiet || git commit -m "chore: atualizar historico de citacoes"
          git push
